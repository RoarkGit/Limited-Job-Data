    {{< green "Additional Effect:" >}} Grants one stack of {{< yellow "Winged Reprobation" >}} and resets this action's recast timer

    {{< green "Maximum Stacks:" >}} 4

    Execution at 3 stacks increases potency to 400 and grants one stack of {{< yellow "Winged Reprobation" >}}, but recast timer will not be reset.

    At maximum stacks, {{< yellow "Winged Reprobation" >}} changes to {{< yellow "Winged Redemption" >}}.

    {{< green "Winged Redemption Effect:" >}} Increases the potency of {{< orange "Conviction Marcato" >}}

