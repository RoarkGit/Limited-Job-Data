# Beastmaster items: everything under XBMItemType, across all three categories the
# game itself defines:
#
#   Beast Gear      worn accessories that modify the beastmaster or familiar
#   Crucible Item   consumables usable only inside the Crucible of the Unbroken
#   Feed            given to a familiar to raise its stats
#
# Extracted from XBMItem via xivapi/ffxiv-datamining. Icons in item-images/ are
# ui/icon/243000/2431NN_hr1.tex.
#
#   id: kebab/snake-case identifier, matching the file name in item-images/
#   name: display name
#   number: the item's row in XBMItem, stable but not a number shown in any in-game UI
#   category: Beast Gear, Crucible Item, or Feed
#   sellPrice: territory tokens received selling to the in-run shop; 0 for Feed,
#     which cannot be sold
#   description: the item's full in-game tooltip

