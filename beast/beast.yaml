# Beastmaster beast data.
#
# Extracted from the game's Excel sheets: XBMPet joined to Pet, Action,
# ActionTransient, PlaceName, ContentFinderCondition, and XBMPetParamGrow. Field
# names and the eight classifications come from the Master's Bestiary UI strings
# (Addon 17712 to 17748). Portraits in images/ are ui/icon/242000/2420NN_hr1.tex.
#
#   id: kebab/snake-case identifier, matching the file name in images/
#   name: display name
#   number: the beast's number in the Master's Bestiary
#   classification: Beastkin, Vilekin, Cloudkin, Seedkin, Wavekin, Scalekin, Soulkin, or Ashkin
#   satiety: how many feedings the beast can take
#   habitat: where the beast can be captured
#   autoAttack: the element and range of the beast's auto-attack
#   trick: the beast's Trick action (Lv. 8), with its full in-game tooltip
#   temperedRelease: the beast's Tempered Release action (Lv. 18), with its full tooltip
#   stats: Strength, Intelligence, Phys. Resistance, Mag. Resistance, and Constitution
#     at rank 25 (max rank); equal to growth[24]
#   growth: the same five stats at every rank 1-25, indexed 0-24, each row
#     [strength, intelligence, physicalResistance, magicalResistance, constitution]
#
# trick and temperedRelease each carry name, element, range, radius and description.
# element is omitted when the action deals no damage; range and radius when they are zero.
# Tooltips have the boilerplate every beast shares stripped (TP gauge cost, instinctual
# affinity, the combo note, Lingering Vantage, and the One with Nature requirement).

